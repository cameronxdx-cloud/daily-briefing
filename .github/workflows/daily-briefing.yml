name: Daily WhatsApp Briefing

on:
  # Started at 5:59 AM Las Vegas time by the Cloudflare scheduler (scheduler/).
  # GitHub's own `schedule:` trigger ran hours late, so it isn't used.
  workflow_dispatch:

jobs:
  send-briefing:
    name: Generate & send morning briefing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Send WhatsApp briefing
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
          YOUR_WHATSAPP_NUMBER:  ${{ secrets.YOUR_WHATSAPP_NUMBER }}
        run: node src/briefing.js
